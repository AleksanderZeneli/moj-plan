name: Synchronizuj oficjalny plan WCY
on:
  workflow_dispatch:
    inputs:
      group:
        description: 'Kod grupy WCY do zsynchronizowania'
        required: true
        default: 'WCY25KY2S1'
        type: string
  schedule:
    - cron: '17 5,17 * * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pobierz bezpośrednio z WCY
        env:
          REQUESTED_GROUP: ${{ inputs.group || 'WCY25KY2S1' }}
        run: |
          GROUP=$(printf '%s' "$REQUESTED_GROUP" | tr '[:lower:]' '[:upper:]')
          if ! [[ "$GROUP" =~ ^WCY[0-9A-Z_]+$ ]]; then
            echo 'Nieprawidłowy kod WCY' >&2
            exit 1
          fi
          python tools/import_wcy.py --group "$GROUP" --output "data/$GROUP.json"
      - name: Zapisz plan, jeśli się zmienił
        run: |
          git config user.name "moj-plan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git diff --cached --quiet || (git commit -m "Aktualizacja oficjalnych planów WCY" && git push)
