name: Powiadomienia Web Push

on:
  schedule:
    # Około 09:10 zimą / 10:10 latem w Polsce (GitHub schedule is best effort).
    - cron: '10 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    # Never run (or send failure emails) before the server is configured.
    if: ${{ vars.WEB_PUSH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wyślij przypomnienia przez chronioną funkcję Supabase
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          CRON_SECRET: ${{ secrets.WEB_PUSH_CRON_SECRET }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo '::error::Brakuje SUPABASE_URL albo WEB_PUSH_CRON_SECRET.'
            exit 1
          fi
          curl --fail-with-body --silent --show-error --retry 2 \
            --request POST \
            --header "x-cron-secret: $CRON_SECRET" \
            "$SUPABASE_URL/functions/v1/send-reminders"
