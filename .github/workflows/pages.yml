name: GitHub Pages — Mój Plan
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths: ['index.html', 'app.js', 'styles.css', 'sw.js', 'manifest.webmanifest', 'icon.svg', 'data/**', 'tools/build_public_config.mjs', 'supabase/migrations/**', '.github/workflows/pages.yml', '.github/workflows/database.yml']
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  database:
    uses: ./.github/workflows/database.yml
    secrets: inherit
  publish:
    needs: database
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Przygotuj statyczną stronę
        run: |
          mkdir -p dist/data
          cp index.html styles.css app.js sw.js manifest.webmanifest icon.svg dist/
          if compgen -G 'data/*.json' > /dev/null; then cp data/*.json dist/data/; fi
          touch dist/.nojekyll
      - name: Wstaw wyłącznie publiczną konfigurację klienta
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: node tools/build_public_config.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
