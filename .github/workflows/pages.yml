name: GitHub Pages — Mój Plan
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Przygotuj statyczną stronę
        run: |
          mkdir -p dist/data
          cp index.html styles.css app.js config.js sw.js manifest.webmanifest icon.svg dist/
          if compgen -G 'data/*.json' > /dev/null; then cp data/*.json dist/data/; fi
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
