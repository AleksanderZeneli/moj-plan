name: Wdróż funkcję powiadomień

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Wdróż Edge Function (bez sekretów w repo)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo '::error::Brak SUPABASE_ACCESS_TOKEN albo SUPABASE_PROJECT_REF.'
            exit 1
          fi
          supabase functions deploy send-reminders --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
